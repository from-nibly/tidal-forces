name: Build and release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a master push: every successful push gets its own release.
concurrency:
  group: build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev xvfb dbus
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Single-instance URI activation
        run: dbus-run-session -- cargo test --locked single_instance_forwards_links_and_activation -- --ignored
      - name: Secret Service migration and recovery contract
        run: dbus-run-session -- env TIDAL_TEST_SECRET_SERVICE=1 cargo test --locked native_secret_service_contract_on_isolated_bus -- --ignored
      - name: Build the single executable
        run: cargo build --locked --release
      - name: Verify release executable
        run: |
          target/release/tidal-forces --version
          ldd target/release/tidal-forces
          LIBGL_ALWAYS_SOFTWARE=1 timeout 30s xvfb-run -a target/release/tidal-forces --smoke-ui
      - name: Package binary and checksum
        run: |
          mkdir dist
          cp target/release/tidal-forces dist/tidal-forces-linux-x86_64
          cd dist
          sha256sum tidal-forces-linux-x86_64 > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tidal-forces-linux-x86_64
          path: dist/*
          if-no-files-found: error
      - name: Publish a release for this master push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="master-${GITHUB_SHA:0:12}"
          version="$(target/release/tidal-forces --version)"
          version="${version##* }"
          case "$version" in *-dev) echo "Development versions must not be published" >&2; exit 1 ;; esac
          notes="docs/releases/v${version}.md"
          test -f "$notes"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "Tidal Forces v${version} · ${GITHUB_SHA:0:12}" \
              --notes-file "$notes"
          fi
          gh release upload "$tag" dist/* --clobber
