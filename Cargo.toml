[package]
name = "tidal-forces"
version = "0.34.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, native TIDAL desktop player"
license = "MIT"
repository = "https://github.com/from-nibly/tidal-forces"

[dependencies]
anyhow = "1"
base64 = "0.22"
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.33", default-features = false, features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
rand = "0.9"
mdns-sd = { version = "=0.21.7", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-all"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
fdk-aac = "0.8"
symphonia = { version = "0.5.5", default-features = false, features = ["isomp4"] }
roxmltree = "0.20"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
stream-download = { version = "0.22", default-features = false, features = ["reqwest-rustls", "temp-storage"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
webbrowser = "1"
zbus = "3.15.2"
zip = { version = "=9.2.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"

[dependencies.prost]
version = "=0.14.4"

[dependencies.ring]
version = "=0.17.14"

[dependencies.rustls]
version = "=0.23.46"
default-features = false
features = ["ring", "std", "tls12"]

[dependencies.rustls-pki-types]
version = "=1.15.1"

[dependencies.rustls-webpki]
version = "=0.103.15"
features = ["ring"]

[dependencies.x509-parser]
version = "=0.18.1"

[patch.crates-io]
libpulse-binding = { path = "vendor/libpulse-binding" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
